<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Guess Arena</title>

  <link rel="stylesheet" href="style.css" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
</head>

<body>

  <div class="background-glow"></div>

  <!-- شاشة الدخول -->
  <section id="loginScreen" class="screen active">

    <div class="glass-card login-card">

      <h1>🎮 Guess Arena</h1>

      <p>ادخل اسمك وابدأ التحدي</p>

      <input
        type="text"
        id="playerName"
        placeholder="اكتب اسمك"
        maxlength="15"
      />

      <button id="enterBtn">
        <i class="fa-solid fa-play"></i>
        دخول اللعبة
      </button>

    </div>

  </section>

  <!-- اختيار اللعبة -->
  <section id="modeScreen" class="screen hidden">

    <h2 class="title">اختر نوع اللعبة</h2>

    <div class="mode-container">

      <div class="mode-card" data-mode="celebrities">
        <i class="fa-solid fa-star"></i>
        <span>المشاهير</span>
      </div>

      <div class="mode-card" data-mode="country">
        <i class="fa-solid fa-earth-asia"></i>
        <span>الدول</span>
      </div>

      <div class="mode-card disabled">
        <i class="fa-solid fa-lock"></i>
        <span>قريباً</span>
      </div>

      <div class="mode-card disabled">
        <i class="fa-solid fa-lock"></i>
        <span>قريباً</span>
      </div>

    </div>

  </section>

  <!-- شاشة اللعبة -->
  <section id="gameScreen" class="screen hidden">

    <header class="topbar">

      <div class="player-box">
        <i class="fa-solid fa-user"></i>
        <span id="playerText">-</span>
      </div>

      <div class="timer-box">
        ⏱ <span id="timer">60</span>
      </div>

      <button id="exitBtn">
        <i class="fa-solid fa-right-from-bracket"></i>
        خروج
      </button>

    </header>

    <div class="game-layout">

      <!-- المعلومات -->
      <aside class="info-panel">

        <div class="selected-image">

          <img
            id="previewImage"
            src="https://placehold.co/600x400?text=Guess+Arena"
            alt="Preview"
          >

        </div>

        <button id="selectBtn">
          اختيار صورة
        </button>

        <div class="info-box">

          <h3>المعلومات</h3>

          <div id="infoContent">
            اختر صورة لعرض المعلومات
          </div>

        </div>

      </aside>

      <!-- الصور -->
      <main class="grid-container" id="grid"></main>

    </div>

  </section>

  <script src="script.js"></script>

</body>

</html>
